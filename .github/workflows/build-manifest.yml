name: Build Opening Manifest

on:
  push:
    branches: [main, master]
    paths:
      - 'public/lines/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public/manifest.json
        run: node scripts/build-manifest.mjs

      - name: Commit updated manifest
        run: |
          if git diff --quiet public/manifest.json; then
            echo "manifest.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/manifest.json
          git commit -m "chore(manifest): update public/manifest.json [skip ci]"
          git push
